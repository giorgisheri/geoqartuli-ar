<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1530">
<title>GeoQartuli · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1530;--royal:#112250;--gold:#E0C58F;--gold2:#C9A968;--ink:#F5F0E9;--muted:#AEBAD4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font:16px/1.5 Inter,-apple-system,system-ui,sans-serif;overflow:hidden}
#ar{position:fixed;inset:0}
.mindar-ui-overlay{display:none!important}
#start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;cursor:pointer;
 background:radial-gradient(120% 80% at 50% 30%,#1B3272 0%,var(--royal) 45%,var(--navy) 100%)}
#start::before{content:"";position:absolute;inset:0;background:radial-gradient(40% 30% at 50% 38%,rgba(224,197,143,.18),transparent 70%);pointer-events:none}
.orb{position:relative;width:min(58vw,250px);aspect-ratio:1}
.orb img{position:absolute;inset:10%;width:80%;border-radius:50%;animation:breathe 3.2s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;padding:3px;
 background:conic-gradient(from 0deg,transparent 0 55%,var(--gold) 80%,#fff 88%,transparent 92%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 2.6s linear infinite}
.orb::after{content:"";position:absolute;inset:4%;border-radius:50%;box-shadow:0 0 60px 6px rgba(224,197,143,.25)}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes breathe{50%{transform:scale(1.035)}}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{margin:0;font-size:clamp(28px,8vw,40px);line-height:1.08;font-weight:700;letter-spacing:-.02em;max-width:12ch}
.tap{display:inline-flex;align-items:center;gap:10px;margin-top:6px;padding:14px 24px;border-radius:999px;background:var(--gold);color:var(--royal);font-weight:700;font-size:17px;box-shadow:0 10px 30px rgba(224,197,143,.28);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 10px 44px rgba(224,197,143,.5);transform:translateY(-1px)}}
#status{min-height:20px;font-size:14px;color:var(--muted)}
.foot{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.link{background:none;border:0;color:var(--muted);font:500 14px Inter,system-ui;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:8px}
.site{font-size:12px;letter-spacing:.08em;color:rgba(174,186,212,.7)}
#frame{position:fixed;inset:0;z-index:4;display:none;align-items:center;justify-content:center;pointer-events:none}
#frame .box{width:min(72vw,320px);aspect-ratio:1;position:relative;animation:breathe 2.4s ease-in-out infinite}
#frame .box i{position:absolute;width:46px;height:46px;border:4px solid var(--gold);border-radius:14px}
#frame .box i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
#frame .box i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
#frame .box i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
#frame .box i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
#frame .box b{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{top:10%}50%{top:88%}}
#bar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;display:none;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:22px;
 background:rgba(11,21,48,.62);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(224,197,143,.28)}
#bar img{width:40px;height:40px;border-radius:10px}
#bar .t{flex:1;min-width:0}
#bar .t b{display:block;font-size:15px}
#bar .t span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#getapp{flex:none;padding:12px 18px;border-radius:14px;background:var(--gold);color:var(--royal);font-weight:700;font-size:15px;text-decoration:none}
#sound{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:7;display:none;border:0;border-radius:999px;padding:10px 16px;background:var(--gold);color:var(--royal);font:700 14px Inter,system-ui}
#fallback{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:16px}
#fallback video{width:100%;max-width:420px;max-height:80vh;border-radius:16px}
#fallback button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:12px 26px;font:600 15px Inter,system-ui}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script>
</head>
<body>
<div id="ar"></div>
<div id="start">
  <div class="orb"><img src="https://giorgisheri.github.io/geoqartuli-ar/logo.png" alt="GeoQartuli"></div>
  <div class="kicker">GeoQartuli · Live</div>
  <h1>Bring it to life</h1>
  <div class="tap">▶ Tap anywhere</div>
  <div id="status"></div>
  <div class="foot">
    <button id="watch" class="link">Just watch the video</button>
    <div class="site">www.geoqartuli.com</div>
  </div>
</div>
<div id="frame"><div class="box"><i></i><i></i><i></i><i></i><b></b></div></div>
<div id="bar"><img src="https://giorgisheri.github.io/geoqartuli-ar/logo.png" alt=""><div class="t"><b>GeoQartuli</b><span id="hintText">Point your camera at the logo</span></div><a id="getapp" href="https://apps.apple.com/us/app/geoqartuli/id6817823917">Get the app</a></div>
<button id="sound">🔊 Tap for sound</button>
<div id="fallback"><video id="fv" src="https://giorgisheri.github.io/geoqartuli-ar/full.mp4" playsinline controls></video><button id="closeF">Close</button></div>
<video id="vid" crossorigin="anonymous" src="https://giorgisheri.github.io/geoqartuli-ar/promo.mp4" playsinline webkit-playsinline loop preload="auto" style="position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>
<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';
const $=id=>document.getElementById(id);
const vid=$('vid');
const GQ=Object.assign({shape:'circle',target:'logo'},window.GQ||{});
const L=(()=>{const q=new URLSearchParams(location.search).get('lang');const n=(q||navigator.language||'en').slice(0,2).toLowerCase();return ['ka','ru','es'].includes(n)?n:'en';})();
const TR={ka:{'Bring it to life':'გააცოცხლე','▶ Tap anywhere':'▶ შეეხე ეკრანს','Just watch the video':'უბრალოდ ვიდეოს ნახვა','Point your camera at the logo':'მიუშვირე კამერა ლოგოს','Point your camera at the photo':'მიუშვირე კამერა ფოტოს','Download the app for more':'მეტისთვის ჩამოწერე აპი','Get the app':'აპის ჩამოწერა','🔊 Tap for sound':'🔊 შეეხე ხმისთვის','Close':'დახურვა','Starting camera…':'კამერა ირთვება…','Camera is blocked. Tap again and choose Allow.':'კამერა დაბლოკილია. ისევ შეეხე და აირჩიე Allow.'},
ru:{'Bring it to life':'Оживите это','▶ Tap anywhere':'▶ Коснитесь экрана','Just watch the video':'Просто посмотреть видео','Point your camera at the logo':'Наведите камеру на логотип','Point your camera at the photo':'Наведите камеру на фото','Download the app for more':'Больше — в приложении','Get the app':'Приложение','🔊 Tap for sound':'🔊 Включить звук','Close':'Закрыть','Starting camera…':'Включаем камеру…','Camera is blocked. Tap again and choose Allow.':'Камера заблокирована. Коснитесь ещё раз и выберите «Разрешить».'},
es:{'Bring it to life':'Dale vida','▶ Tap anywhere':'▶ Toca la pantalla','Just watch the video':'Solo ver el video','Point your camera at the logo':'Apunta la cámara al logo','Point your camera at the photo':'Apunta la cámara a la foto','Download the app for more':'Descarga la app para más','Get the app':'Descargar app','🔊 Tap for sound':'🔊 Toca para el sonido','Close':'Cerrar','Starting camera…':'Abriendo la cámara…','Camera is blocked. Tap again and choose Allow.':'La cámara está bloqueada. Toca otra vez y elige Permitir.'}};
const t=k=>(TR[L]&&TR[L][k])||k;
const HINT=GQ.target==='photo'?'Point your camera at the photo':'Point your camera at the logo';
document.documentElement.lang=L;
document.querySelector('#start h1').textContent=t('Bring it to life');document.querySelector('#start .tap').textContent=t('▶ Tap anywhere');
$('watch').textContent=t('Just watch the video');$('hintText').textContent=t(HINT);$('getapp').textContent=t('Get the app');$('sound').textContent=t('🔊 Tap for sound');$('closeF').textContent=t('Close');
let mind=null,started=false,tapped=false;
{const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 if(!ios)$('getapp').href='https://geoqartuli.com';}
$('watch').onclick=e=>{e.stopPropagation();$('fallback').style.display='flex';$('fv').play().catch(()=>{});};
$('closeF').onclick=()=>{$('fv').pause();$('fallback').style.display='none';};
const unmute=()=>{vid.muted=false;$('sound').style.display='none';if(!vid.paused)vid.play().catch(()=>{});};
$('sound').onclick=e=>{e.stopPropagation();unmute();};
document.addEventListener('pointerdown',()=>{if(started&&vid.muted)unmute();});
async function playVid(){
  vid.muted=false;
  try{await vid.play();}catch(e){vid.muted=true;try{await vid.play();}catch(_){} $('sound').style.display='block';}
}
async function startAR(){
  $('status').textContent=t('Starting camera…');
  try{
    if(!mind){
      mind=new MindARThree({container:$('ar'),imageTargetSrc:'https://giorgisheri.github.io/geoqartuli-ar/logo.mind',uiLoading:'no',uiScanning:'no',uiError:'no',filterMinCF:0.0001,filterBeta:0.001});
      const tex=new THREE.VideoTexture(vid);tex.colorSpace=THREE.SRGBColorSpace;
      const fit=()=>{const w=vid.videoWidth,h=vid.videoHeight;if(!w||!h)return;const a=w/h;if(a>1){tex.repeat.set(1/a,1);tex.offset.set((1-1/a)/2,0);}else{tex.repeat.set(1,a);tex.offset.set(0,(1-a)/2);}};
      vid.addEventListener('loadedmetadata',fit);fit();
      let geo;if(GQ.shape==='square'){const r=0.05,sh=new THREE.Shape();sh.moveTo(r,0);sh.lineTo(1-r,0);sh.quadraticCurveTo(1,0,1,r);sh.lineTo(1,1-r);sh.quadraticCurveTo(1,1,1-r,1);sh.lineTo(r,1);sh.quadraticCurveTo(0,1,0,1-r);sh.lineTo(0,r);sh.quadraticCurveTo(0,0,r,0);geo=new THREE.ShapeGeometry(sh,24);geo.translate(-0.5,-0.5,0);}else{geo=new THREE.CircleGeometry(0.49,96);}
      const disc=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:tex}));
      const anchor=mind.addAnchor(0);anchor.group.add(disc);
      anchor.onTargetFound=()=>{playVid();$('frame').style.display='none';$('hintText').textContent=t('Download the app for more');};
      anchor.onTargetLost=()=>{vid.pause();$('frame').style.display='flex';$('hintText').textContent=t(HINT);};
    }
    await mind.start();
    mind.renderer.setAnimationLoop(()=>mind.renderer.render(mind.scene,mind.camera));
    started=true;
    $('start').style.display='none';$('frame').style.display='flex';$('bar').style.display='flex';
  }catch(e){
    tapped=false;
    $('status').textContent=t('Camera is blocked. Tap again and choose Allow.');
  }
}
$('start').addEventListener('click',()=>{if(tapped)return;tapped=true;
  vid.muted=false;vid.play().then(()=>{vid.pause();vid.currentTime=0;}).catch(()=>{});
  startAR();});
</script>
</body>
</html>
