<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GeoQartuli AR</title>
<style>
html,body{margin:0;height:100%;background:#112250;color:#fff;font:16px/1.5 -apple-system,system-ui,sans-serif;overflow:hidden}
#ar{position:fixed;inset:0}
#start{position:fixed;inset:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:#112250;z-index:10}
#start img{width:min(46vw,220px)}
h1{margin:0;font-size:24px;font-weight:700}
p{margin:0;color:#c9d2ea;max-width:320px}
button,.btn{appearance:none;border:0;border-radius:999px;padding:14px 26px;font:600 17px/1 system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.gold{background:#E0C58F;color:#112250}
.ghost{background:rgba(255,255,255,.12);color:#fff}
#hint{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));display:none;flex-direction:column;align-items:center;gap:12px;z-index:5;pointer-events:none}
#hint span{background:rgba(17,34,80,.82);padding:8px 16px;border-radius:999px;font-size:15px}
#hint a{pointer-events:auto}
#fallback{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:16px}
#fallback video{width:100%;max-width:420px;max-height:80vh}
.mindar-ui-overlay{display:none!important}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script>
</head>
<body>
<div id="ar"></div>
<div id="start">
  <img src="logo.png" alt="GeoQartuli">
  <h1>Bring the logo to life</h1>
  <p id="status" style="font-size:20px;color:#E0C58F;font-weight:600">Tap anywhere to see the video</p>
  <button id="go" class="gold" style="display:none">▶ Try again</button>
  <button id="watch" class="ghost" style="position:absolute;bottom:calc(28px + env(safe-area-inset-bottom))">Just watch the video</button>
</div>
<div id="hint"><span id="hintText">Point your camera at the logo</span><a class="btn gold" href="https://geoqartuli.com">Get the GeoQartuli app</a></div>
<button id="sound" class="gold" style="position:fixed;top:calc(16px + env(safe-area-inset-top));right:16px;z-index:6;display:none">🔊 Tap for sound</button>
<div id="fallback"><video id="fv" src="full.mp4" playsinline controls></video><button class="ghost" id="closeF">Close</button></div>
<video id="vid" src="promo.mp4" playsinline webkit-playsinline loop preload="auto" style="position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>
<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';
const $=id=>document.getElementById(id);
const vid=$('vid');
let mind=null,started=false;
$('watch').onclick=e=>{e.stopPropagation();$('fallback').style.display='flex';$('fv').play().catch(()=>{});};
$('closeF').onclick=()=>{$('fv').pause();$('fallback').style.display='none';};
const unmute=()=>{vid.muted=false;$('sound').style.display='none';if(!vid.paused)vid.play().catch(()=>{});};
$('sound').onclick=e=>{e.stopPropagation();unmute();};
document.addEventListener('pointerdown',()=>{if(started&&vid.muted)unmute();});
async function playVid(){
  vid.muted=false;
  try{await vid.play();}catch(e){vid.muted=true;try{await vid.play();}catch(_){}
    $('sound').style.display='block';}
}
async function startAR(){
  $('go').style.display='none';$('status').textContent='Starting camera…';
  try{
    if(!mind){
      mind=new MindARThree({container:$('ar'),imageTargetSrc:'logo.mind',uiLoading:'no',uiScanning:'no',uiError:'no',filterMinCF:0.0001,filterBeta:0.001});
      const tex=new THREE.VideoTexture(vid);tex.colorSpace=THREE.SRGBColorSpace;
      const disc=new THREE.Mesh(new THREE.CircleGeometry(0.49,96),new THREE.MeshBasicMaterial({map:tex}));
      const anchor=mind.addAnchor(0);anchor.group.add(disc);
      anchor.onTargetFound=()=>{playVid();$('hintText').textContent='Tap “Get the app” anytime';};
      anchor.onTargetLost=()=>{vid.pause();$('hintText').textContent='Point your camera at the logo';};
    }
    await mind.start();
    mind.renderer.setAnimationLoop(()=>mind.renderer.render(mind.scene,mind.camera));
    started=true;
    $('start').style.display='none';$('hint').style.display='flex';
  }catch(e){
    $('go').style.display='inline-block';
    tapped=true;$('status').textContent='Camera is blocked. Tap “Try again” and choose Allow, or just watch the video.';
  }
}
let tapped=false;
$('start').addEventListener('click',()=>{if(tapped)return;tapped=true;
  vid.muted=false;vid.play().then(()=>{vid.pause();vid.currentTime=0;}).catch(()=>{});
  startAR();});
$('go').onclick=e=>{e.stopPropagation();startAR();};
</script>
</body>
</html>
